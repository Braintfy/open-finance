services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: openfinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openfinance_dev}
      POSTGRES_USER: ${POSTGRES_USER:-openfinance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfinance_local_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - openfinance_postgres_data:/var/lib/postgresql/data
      # Монтируем ТОЛЬКО 01-extensions.sql: на пустом volume entrypoint выполняет скрипты
      # с ON_ERROR_STOP, а файлы 03+ ссылаются на ещё не созданные таблицы (tenants и др.) → падение старта.
      # Схему создаёт `pnpm db:migrate`, затем 02-vector-indexes.sql применяется вручную (см. docs/DEPLOY_RPI5.md).
      - ./drizzle/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openfinance_user} -d ${POSTGRES_DB:-openfinance_dev}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: openfinance-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - openfinance_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: openfinance-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_PORT:-9100}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - openfinance_minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openfinance_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openfinance_minio_local_dev}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: openfinance-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      - postgres

volumes:
  openfinance_postgres_data:
    driver: local
  openfinance_redis_data:
    driver: local
  openfinance_minio_data:
    driver: local

networks:
  default:
    name: openfinance_network
